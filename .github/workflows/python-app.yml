name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry==2.2.1
        poetry sync
        poetry check --lock
    - name: Test
      run: poetry run python -W default -m unittest discover -s tests -v
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        poetry run flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        poetry run flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Check requirements export
      run: |
        poetry export --only main --without-hashes -o requirements.txt
        git diff --exit-code -- requirements.txt
